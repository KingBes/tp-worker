name: tests

on:
  push:
    branches:
      - "master"
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        php: [ "8.2", "8.3", "8.4", "8.5" ]
        # Windows 无 posix/pcntl 扩展，Unix 平台按需开启；pdo_sqlite 供 db 心跳测试用
        include:
          - os: windows-latest
            extensions: "json, pdo_sqlite"
          - os: ubuntu-latest
            extensions: "json, posix, pcntl, pdo_sqlite"
          - os: macos-latest
            extensions: "json, posix, pcntl, pdo_sqlite"

    name: PHP ${{ matrix.php }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: xdebug

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer install --prefer-dist --no-interaction --no-progress --ansi

      - name: Static analysis
        run: composer analyze

      - name: Execute tests
        run: composer test
